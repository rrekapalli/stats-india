# Stats India — single LXC (UI + API). Override secrets in workspace .env

STATS_INDIA_VMID=7001
STATS_INDIA_CONTAINER_NAME=stats-india
STATS_INDIA_HOST=stats-india.tailce422e.ts.net

# Clone from moneytree LXC base (Java 21+); or moneytree-lxc-frontend-base + deploy-api installs Java
STATS_INDIA_CLONE_TEMPLATE=moneytree-lxc-base
CLONE_TEMPLATE_VMID=9001

STATS_INDIA_CORES=2
STATS_INDIA_MEMORY_MB=2048
STATS_INDIA_ROOTFS_GB=16

API_PORT=8080
UI_PORT=80

STATS_INDIA_APP_USER=stats-india
STATS_INDIA_WEB_ROOT=/var/www/stats-india
STATS_INDIA_APP_DIR=/opt/stats-india

LXC_ROOTFS_STORAGE=local-storage
