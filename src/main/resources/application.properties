# Spring Boot reads DATA_GOV_IN_API_KEY from the environment (workspace .env locally, systemd on deploy).
stats-india.data-gov-in.api-key=${DATA_GOV_IN_API_KEY:}
stats-india.data-gov-in.base-url=https://api.data.gov.in

# --- PostgreSQL (pg18) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://pg18.tailce422e.ts.net:6432/stats-india}
spring.datasource.username=${DB_USERNAME:stats_india}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET default_transaction_isolation = 'read committed'

# Flyway owns schema. Spring Batch tables come from V3 migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Batch: schema managed by Flyway; do not auto-run any job at startup.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# --- Dataset ingestion tuning (Spring Batch chunks data.gov.in pages) ---
stats-india.cache.page-size=10000
stats-india.cache.request-delay-ms=300
stats-india.cache.refresh-after-days=7
stats-india.cache.refresh-cron=0 0 3 * * SUN
stats-india.cache.sync-on-startup=false
