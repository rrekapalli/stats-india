# Spring Boot reads DATA_GOV_IN_API_KEY from the environment (workspace .env locally, systemd on deploy).
stats-india.data-gov-in.api-key=${DATA_GOV_IN_API_KEY:}
stats-india.data-gov-in.base-url=https://api.data.gov.in

# Embedded SQLite cache (lightweight local document store for portal datasets).
stats-india.cache.db-path=${STATS_INDIA_CACHE_DIR:./data}/datasets.db
stats-india.cache.page-size=10000
stats-india.cache.request-delay-ms=300
stats-india.cache.refresh-after-days=7
stats-india.cache.refresh-cron=0 0 3 * * SUN
stats-india.cache.sync-on-startup=false
