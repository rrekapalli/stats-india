<div class="layout">
  <!-- Top Header -->
  <header class="top-header">
    <p-toolbar>
      <div class="p-toolbar-group-start">
        <span class="app-title">{{ title }}</span>
      </div>
    </p-toolbar>
  </header>

  <!-- Main content area -->
  <div class="content">
    <!-- Left Navigation (30% width) -->
    <aside class="side-nav">
      <p-panel header="Navigation">
        <p-menu [model]="sideNavItems"></p-menu>
      </p-panel>
    </aside>

    <!-- Right Content -->
    <section class="main-panel">
      <!-- Top Menubar inside right content -->
      <p-menubar [model]="topMenuItems" class="top-menubar"></p-menubar>

      <!-- Page Content -->
      <div class="main-content">
        <ng-container [ngSwitch]="activeView">
          <div *ngSwitchCase="'overview'">
            <p-card header="Overview">
              <p>Quick snapshot of key indicators.</p>
              <ul>
                <li *ngFor="let s of stats">
                  <strong>{{ s.label }}:</strong> {{ s.value }}
                </li>
              </ul>
            </p-card>
          </div>

          <div *ngSwitchCase="'data'">
            <p-card header="Data">
              <p>Data section placeholder. Integrate tables and charts here.</p>
            </p-card>
          </div>
        </ng-container>
      </div>
    </section>
  </div>
</div>
