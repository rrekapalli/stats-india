<div style="font-family: Arial, sans-serif; padding: 2rem;">
  <h1>{{ title }}</h1>
  <p>This is an Angular v20 UI bundled with the API.</p>
  <section>
    <h2>Nation Stats (Sample)</h2>
    <ul>
      <li *ngFor="let s of stats">
        <strong>{{ s.label }}:</strong> {{ s.value }}
      </li>
    </ul>
  </section>
  <section>
    <h2>API Health</h2>
    <p>Check <code>/api/health</code> after starting the app.</p>
  </section>
</div>
